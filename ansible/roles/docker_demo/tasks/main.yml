---
# Demo instance on its own server (demo.bazarpro.de): installs Docker on a fresh Ubuntu,
# starts frontend, backend and database with the demo data and resets them every night.

- name: Require the domain of the demo
  ansible.builtin.assert:
    that:
      - demo_domain | length > 0
      - acme_email | length > 0
    fail_msg: Set DEMO_DOMAIN and ACME_EMAIL (repository variables, see docs/env.md).

- name: Install Docker and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Start Docker on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Backend, Postgres, Node and Traefik fit into 2 GB; the swap file catches peaks
- name: Check for a swap file
  ansible.builtin.stat:
    path: /swapfile
  register: docker_demo_swapfile

- name: Create a swap file of 2 GB
  ansible.builtin.shell: |
    fallocate -l 2G /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab
  when: not docker_demo_swapfile.stat.exists
  changed_when: true

- name: Ensure the demo directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0755'
  loop:
    - '{{ demo_dir }}'
    - '{{ demo_dir }}/scripts'
    - '{{ demo_dir }}/letsencrypt'

- name: Write the Docker Compose file
  ansible.builtin.template:
    src: docker-compose.demo.yml.j2
    dest: '{{ demo_dir }}/docker-compose.yml'
    mode: '0644'

- name: Write the Traefik configuration
  ansible.builtin.template:
    src: traefik.demo.yml.j2
    dest: '{{ demo_dir }}/traefik.yml'
    mode: '0644'
  notify: Restart Traefik

- name: Copy the reset script
  ansible.builtin.copy:
    src: reset-demo.sh
    dest: '{{ demo_dir }}/scripts/reset-demo.sh'
    mode: '0755'

# Read by scripts/reset-demo.sh after every reset; only root can read it
- name: Store the password of the demo's admin
  ansible.builtin.copy:
    content: "{{ demo_admin_password }}\n"
    dest: '{{ demo_dir }}/admin-password'
    mode: '0600'
  no_log: true
  when: demo_admin_password | length > 0

- name: Reset the demo every night at 3:00 UTC
  ansible.builtin.cron:
    name: reset bazarpro demo
    minute: '0'
    hour: '3'
    job: '{{ demo_dir }}/scripts/reset-demo.sh >> /var/log/bazarpro-demo-reset.log 2>&1'

- name: Pull and start the demo
  community.docker.docker_compose_v2:
    project_src: '{{ demo_dir }}'
    state: present
    pull: always
    remove_orphans: true

# The demo data sign in admin@bazarpro.de with 123456; the deploy seeds a new database
- name: Set the password of the demo's admin
  ansible.builtin.shell: >-
    docker compose exec -T backend bazarpro-backend password admin@bazarpro.de
    < admin-password
  args:
    chdir: '{{ demo_dir }}'
  no_log: true
  changed_when: true
  when: demo_admin_password | length > 0

- name: Remove old images
  ansible.builtin.command: docker image prune --all --force
  register: docker_demo_prune
  changed_when: "'Total reclaimed space: 0B' not in docker_demo_prune.stdout"
